<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiEditais</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">WikiEditais</a>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Início</a>
      <a href="{{ url_for('analise') }}" class="{% if request.endpoint == 'analise' %}active{% endif %}">Análise</a>
      <a href="{{ url_for('debug') }}" class="{% if request.endpoint in ['debug','debug_edital'] %}active{% endif %}">Debug</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <section class="alerts">
          {% for message in messages %}<div>{{ message }}</div>{% endfor %}
        </section>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
