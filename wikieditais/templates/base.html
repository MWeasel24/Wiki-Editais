<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'WikiEditais' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-orb one"></div><div class="bg-orb two"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">Wiki<span>Editais</span></a>
    <nav>
      <a href="{{ url_for('home') }}" class="{% if request.endpoint=='home' %}active{% endif %}">Início</a>
      <a href="{{ url_for('compare') }}" class="{% if request.endpoint=='compare' %}active{% endif %}">Comparar</a>
      <a href="{{ url_for('analysis') }}" class="{% if request.endpoint=='analysis' %}active{% endif %}">Análise</a>
      <a href="{{ url_for('debug') }}" class="{% if request.endpoint in ['debug','edit_edital'] %}active{% endif %}">Debug</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
